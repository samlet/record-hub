server_name: record-hub-local
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_file_store: 1GB
}

max_payload: 1MB
write_deadline: "10s"

authorization {
  users: [
    {
      user: "record-hub-admin"
      password: $NATS_ADMIN_PASSWORD
    }
    {
      user: "approver-relay"
      password: $NATS_APPROVER_PASSWORD
      permissions: {
        publish: [
          "events.approver.>"
          "results.approver.>"
          "$JS.API.STREAM.INFO.APPROVAL_COMMANDS"
          "$JS.API.CONSUMER.INFO.APPROVAL_COMMANDS.approver-command-inbox-v1"
          "$JS.API.CONSUMER.MSG.NEXT.APPROVAL_COMMANDS.approver-command-inbox-v1"
          "$JS.ACK.APPROVAL_COMMANDS.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "fluxion-relay"
      password: $NATS_FLUXION_PASSWORD
      permissions: {
        publish: [
          "events.fluxion.>"
          "results.fluxion.>"
          "$JS.API.STREAM.INFO.OWNER_COMMANDS"
          "$JS.API.CONSUMER.INFO.OWNER_COMMANDS.fluxion-command-inbox-v1"
          "$JS.API.CONSUMER.MSG.NEXT.OWNER_COMMANDS.fluxion-command-inbox-v1"
          "$JS.ACK.OWNER_COMMANDS.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "bids-relay"
      password: $NATS_BIDS_PASSWORD
      permissions: {
        publish: [
          "events.bids.>"
          "results.bids.>"
          "$JS.API.STREAM.INFO.OWNER_COMMANDS"
          "$JS.API.CONSUMER.INFO.OWNER_COMMANDS.bids-command-inbox-v1"
          "$JS.API.CONSUMER.MSG.NEXT.OWNER_COMMANDS.bids-command-inbox-v1"
          "$JS.ACK.OWNER_COMMANDS.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "record-hub-projector"
      password: $NATS_RECORD_HUB_PASSWORD
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.DOMAIN_EVENTS"
          "$JS.API.STREAM.INFO.COMMAND_RESULTS"
          "$JS.API.CONSUMER.INFO.DOMAIN_EVENTS.record-hub-approver-projection-v1"
          "$JS.API.CONSUMER.INFO.DOMAIN_EVENTS.record-hub-fluxion-projection-v1"
          "$JS.API.CONSUMER.INFO.DOMAIN_EVENTS.record-hub-bids-projection-v1"
          "$JS.API.CONSUMER.MSG.NEXT.DOMAIN_EVENTS.record-hub-approver-projection-v1"
          "$JS.API.CONSUMER.MSG.NEXT.DOMAIN_EVENTS.record-hub-fluxion-projection-v1"
          "$JS.API.CONSUMER.MSG.NEXT.DOMAIN_EVENTS.record-hub-bids-projection-v1"
          "$JS.API.CONSUMER.INFO.COMMAND_RESULTS.record-hub-command-results-v1"
          "$JS.API.CONSUMER.MSG.NEXT.COMMAND_RESULTS.record-hub-command-results-v1"
          "$JS.ACK.DOMAIN_EVENTS.>"
          "$JS.ACK.COMMAND_RESULTS.>"
          "dlq.record-hub.>"
          "commands.approver.>"
          "commands.fluxion.>"
          "commands.bids.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
