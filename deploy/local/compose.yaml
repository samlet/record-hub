name: record-hub

services:
  mongodb-keyfile:
    image: mongo:8.0.32-noble
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        if [[ ! -s /keyfile/mongodb-keyfile ]]; then
          umask 077
          openssl rand -base64 756 > /keyfile/mongodb-keyfile
        fi
        chown 999:999 /keyfile/mongodb-keyfile
        chmod 400 /keyfile/mongodb-keyfile
    volumes:
      - mongodb-keyfile:/keyfile

  mongodb:
    image: mongo:8.0.32-noble
    restart: unless-stopped
    depends_on:
      mongodb-keyfile:
        condition: service_completed_successfully
    command:
      - mongod
      - --replSet
      - record-hub-rs
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile/mongodb-keyfile
    environment:
      # Docker Desktop 2026 kernels need glibc rseq enabled for MongoDB's TCMalloc.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?set MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?set MONGODB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${RECORD_HUB_MONGODB_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1:27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - mongodb-data:/data/db
      - mongodb-keyfile:/etc/mongo-keyfile:ro

  mongodb-init:
    image: mongo:8.0.32-noble
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?set MONGODB_ROOT_USERNAME}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?set MONGODB_ROOT_PASSWORD}
      RECORD_HUB_MONGODB_USERNAME: ${RECORD_HUB_MONGODB_USERNAME:?set RECORD_HUB_MONGODB_USERNAME}
      RECORD_HUB_MONGODB_PASSWORD: ${RECORD_HUB_MONGODB_PASSWORD:?set RECORD_HUB_MONGODB_PASSWORD}
    entrypoint: ["/bin/bash", "/scripts/initialize-mongodb.sh"]
    volumes:
      - ./mongodb/initialize-mongodb.sh:/scripts/initialize-mongodb.sh:ro

volumes:
  mongodb-data:
  mongodb-keyfile:
