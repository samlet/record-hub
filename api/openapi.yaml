openapi: 3.0.3
info:
  title: Record Hub API
  version: 0.1.0
  description: Stable HTTP contract for Record Hub clients and workflow bindings.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: System
  - name: Identity
  - name: Records
  - name: Realtime
  - name: Schema
  - name: Projection Catalog
  - name: Operations
  - name: Associations
  - name: Bindings
  - name: Commands
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Report dependency readiness
      security: []
      responses:
        "200":
          description: All required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/operations/events:
    get:
      tags: [Operations]
      operationId: getProjectionOperations
      summary: Read bounded projection backlog and checkpoint health
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/ConsumerQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Safe counts and checkpoint metadata without event payloads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionOperationsSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: One or more required dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/associations/project-applications:
    get:
      tags: [Associations]
      operationId: listProjectApplicationAssociations
      summary: Read typed Project↔Application associations
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: projectRef
          in: query
          schema:
            type: string
            pattern: "^fluxion:PROJECT:[0-9a-fA-F-]{36}$"
        - name: applicationRef
          in: query
          schema:
            type: string
            pattern: "^approver:APPLICATION:[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Safe typed association read model.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/ProjectApplicationAssociation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projection/rebuilds:
    post:
      tags: [Operations]
      operationId: startProjectionRebuild
      summary: Start an owner-authorized projection generation rebuild
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionRebuildScopeRequest"
      responses:
        "202":
          description: Rebuild accepted for the projection worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRebuildOperation"
        "200":
          description: Existing operation returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRebuildOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projection/rebuilds/{operationID}:
    get:
      tags: [Operations]
      operationId: getProjectionRebuild
      summary: Read a projection rebuild operation
      parameters:
        - name: operationID
          in: path
          required: true
          schema:
            type: string
            pattern: "^rebuild-[a-f0-9]{24}$"
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Rebuild operation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRebuildOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projection/rebuilds/{operationID}/cancel:
    post:
      tags: [Operations]
      operationId: cancelProjectionRebuild
      summary: Request cancellation of a projection rebuild
      parameters:
        - name: operationID
          in: path
          required: true
          schema:
            type: string
            pattern: "^rebuild-[a-f0-9]{24}$"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionRebuildScopeRequest"
      responses:
        "202":
          description: Cancellation accepted or requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRebuildOperation"
        "200":
          description: Existing cancellation returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRebuildOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/bindings/snapshots:
    post:
      tags: [Bindings]
      operationId: createBindingSnapshot
      summary: Create an immutable workflow snapshot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingSnapshotCreateRequest"
      responses:
        "201":
          description: Snapshot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingSnapshot"
        "200":
          description: Existing snapshot returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: Binding service is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/commands:
    post:
      tags: [Commands]
      operationId: submitCommand
      summary: Submit an owner-system command with an operation receipt
      description: Requires an exact workload policy. The command payload is published to the owner system; Record Hub never executes the owner business action.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandSubmitRequest"
      responses:
        "202":
          description: Command accepted or dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOperation"
        "200":
          description: Existing operation returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/commands/{operationID}:
    parameters:
      - $ref: "#/components/parameters/CommandOperationID"
    get:
      tags: [Commands]
      operationId: getCommandOperation
      summary: Read a command operation receipt
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Command operation receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/bindings/snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [Bindings]
      operationId: getBindingSnapshot
      summary: Read an immutable workflow snapshot
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Immutable snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Binding service is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentPrincipal
      summary: Resolve the authenticated principal
      responses:
        "200":
          description: The authenticated principal and its workspace memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/workspaces:
    get:
      tags: [Records]
      operationId: listWorkspaces
      summary: List workspaces created by the authenticated principal
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Workspaces visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Records]
      operationId: createWorkspace
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/tables:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Records]
      operationId: listTables
      summary: List tables in a workspace
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Tables visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Records]
      operationId: createTable
      summary: Create a custom or projection table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCreateRequest"
      responses:
        "201":
          description: Table created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: getTable
      summary: Get one table definition
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Table definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tables/{tableId}/records:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: listRecords
      summary: List records through a bounded view query
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/ViewIdQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: A bounded page of records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Records]
      operationId: createRecord
      summary: Create a validated custom-table record
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCreateRequest"
      responses:
        "201":
          description: Record created.
          headers:
            ETag:
              $ref: "#/components/headers/RecordVersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/records/stream:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Realtime]
      operationId: streamRecordChanges
      summary: Stream bounded record references over Server-Sent Events
      description: Events are scoped to one tenant/workspace/table and contain references only. Use Last-Event-ID or cursor to resume within the retained recovery window.
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: A long-lived Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The cursor is older than the retained recovery window and the client must requery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The bounded feed connection quota has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/tables/{tableId}/views:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: listViews
      summary: List views for a table
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Views visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Records]
      operationId: createView
      summary: Create a bounded filter and sort view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewCreateRequest"
      responses:
        "201":
          description: View created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/views/{viewId}:
    parameters:
      - $ref: "#/components/parameters/TableId"
      - name: viewId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    patch:
      tags: [Records]
      operationId: updateView
      summary: Update a view with optimistic concurrency control
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewUpdateRequest"
      responses:
        "200":
          description: Updated view.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /api/v1/tables/{tableId}/indexes:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: listIndexes
      summary: List bounded dynamic field indexes for a table
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Index definitions visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Records]
      operationId: createIndex
      summary: Create an administrator-approved bounded field index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexCreateRequest"
      responses:
        "201":
          description: Index definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    get:
      tags: [Records]
      operationId: getRecord
      summary: Get one record by scoped ID
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Record envelope.
          headers:
            ETag:
              $ref: "#/components/headers/RecordVersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Records]
      operationId: updateRecord
      summary: Update record data with record-version CAS
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfMatchRecord"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdateRequest"
      responses:
        "200":
          description: Record updated.
          headers:
            ETag:
              $ref: "#/components/headers/RecordVersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: Delete a record with record-version CAS
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/TableIdQuery"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfMatchRecord"
      responses:
        "200":
          description: Deleted record snapshot, safe for idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /api/v1/sources:
    get:
      tags: [Projection Catalog]
      operationId: listProjectionSources
      summary: List source registrations visible to a workspace
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Bounded source registration list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRegistrationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Projection Catalog]
      operationId: createProjectionSource
      summary: Register a draft event source
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRegistrationCreateRequest"
      responses:
        "201":
