openapi: 3.0.3
info:
  title: Record Hub API
  version: 0.1.0
  description: Stable HTTP contract for Record Hub clients and workflow bindings.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: System
  - name: Identity
  - name: Records
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Report dependency readiness
      security: []
      responses:
        "200":
          description: All required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentPrincipal
      summary: Resolve the authenticated principal
      responses:
        "200":
          description: The authenticated principal and its workspace memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/workspaces:
    get:
      tags: [Records]
      operationId: listWorkspaces
      summary: List workspaces created by the authenticated principal
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Workspaces visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Records]
      operationId: createWorkspace
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/tables:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Records]
      operationId: listTables
      summary: List tables in a workspace
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Tables visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Records]
      operationId: createTable
      summary: Create a custom or projection table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCreateRequest"
      responses:
        "201":
          description: Table created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: getTable
      summary: Get one table definition
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
      responses:
        "200":
          description: Table definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tables/{tableId}/records:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: listRecords
      summary: List records through a bounded view query
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/ViewIdQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: A bounded page of records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Records]
      operationId: createRecord
      summary: Create a validated custom-table record
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCreateRequest"
      responses:
        "201":
          description: Record created.
          headers:
            ETag:
              $ref: "#/components/headers/RecordVersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/views:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: listViews
      summary: List views for a table
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Views visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Records]
      operationId: createView
      summary: Create a bounded filter and sort view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewCreateRequest"
      responses:
        "201":
          description: View created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tables/{tableId}/indexes:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [Records]
      operationId: listIndexes
      summary: List bounded dynamic field indexes for a table
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Index definitions visible to the principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Records]
      operationId: createIndex
      summary: Create an administrator-approved bounded field index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexCreateRequest"
      responses:
        "201":
          description: Index definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    get:
      tags: [Records]
      operationId: getRecord
      summary: Get one record by scoped ID
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Record envelope.
          headers:
            ETag:
              $ref: "#/components/headers/RecordVersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Records]
      operationId: updateRecord
      summary: Update record data with record-version CAS
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfMatchRecord"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdateRequest"
      responses:
        "200":
          description: Record updated.
          headers:
            ETag:
              $ref: "#/components/headers/RecordVersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: Delete a record with record-version CAS
      parameters:
        - $ref: "#/components/parameters/TenantIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/TableIdQuery"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfMatchRecord"
      responses:
        "200":
          description: Deleted record snapshot, safe for idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /api/v1/schemas:
    post:
      tags: [Schema]
      operationId: createSchemaDraft
      summary: Create a schema draft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaDraftRequest"
      responses:
        "201":
          description: Draft created.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/schemas/{schemaId}/draft:
    put:
      tags: [Schema]
      operationId: updateSchemaDraft
      summary: Update a schema draft with an expected revision
      parameters:
        - $ref: "#/components/parameters/SchemaId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaDraftRequest"
      responses:
        "200":
          description: Draft updated.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /api/v1/schemas/{schemaId}/publish:
    post:
      tags: [Schema]
      operationId: publishSchema
      summary: Publish a draft schema with an expected revision
      parameters:
        - $ref: "#/components/parameters/SchemaId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaPublishRequest"
      responses:
        "200":
          description: Schema published.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://127.0.0.1:5556/dex/.well-known/openid-configuration
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The principal is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current state or idempotency data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionRequired:
      description: The expected revision is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      description: Tenant scope for the request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceIdQuery:
      name: workspaceId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TableIdQuery:
      name: tableId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ViewIdQuery:
      name: viewId
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque stable cursor returned by a previous page.
      schema:
        type: string
        maxLength: 2048
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SchemaId:
      name: schemaId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
    IfMatchRecord:
      name: If-Match
      in: header
      required: true
      description: Expected current recordVersion as a quoted ETag.
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
  headers:
    RevisionETag:
      description: Current schema revision as a quoted ETag.
      schema:
        type: string
    RecordVersionETag:
      description: Current recordVersion as a quoted ETag.
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          example: AUTHENTICATION_REQUIRED
        message:
          type: string
          maxLength: 512
          example: Authentication is required.
        requestId:
          type: string
          maxLength: 128
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [mongodb, nats, dex]
          properties:
            mongodb:
              $ref: "#/components/schemas/DependencyStatus"
            nats:
              $ref: "#/components/schemas/DependencyStatus"
            dex:
              $ref: "#/components/schemas/DependencyStatus"
    DependencyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    Principal:
      type: object
      additionalProperties: false
      required: [issuer, subject, memberships]
      properties:
        issuer:
          type: string
          format: uri
        subject:
          type: string
          minLength: 1
          maxLength: 256
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembership"
    WorkspaceMembership:
      type: object
      additionalProperties: false
      required: [workspaceId, role]
      properties:
        workspaceId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required: [tenantId, id, name]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
    Workspace:
      type: object
      additionalProperties: false
      required: [id, tenantId, name, version, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        version:
          type: integer
          minimum: 1
        createdBy:
          $ref: "#/components/schemas/IdentityKey"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    TableCreateRequest:
      type: object
      additionalProperties: false
      required: [tenantId, id, name, kind, schemaId, schemaVersion]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum: [CUSTOM, PROJECTION]
        schemaId:
          type: string
          minLength: 1
          maxLength: 256
        schemaVersion:
          type: integer
          minimum: 1
        sourcePolicy:
          $ref: "#/components/schemas/SourcePolicy"
    SourcePolicy:
      type: object
      additionalProperties: false
      required: [system, type]
      properties:
        system:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          minLength: 1
          maxLength: 128
        allowFields:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    TableDefinition:
      type: object
      additionalProperties: false
      required: [id, tenantId, workspaceId, name, kind, schemaId, schemaVersion, version, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [CUSTOM, PROJECTION]
        schemaId:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        sourcePolicy:
          $ref: "#/components/schemas/SourcePolicy"
        version:
          type: integer
          minimum: 1
        createdBy:
          $ref: "#/components/schemas/IdentityKey"
        updatedBy:
          $ref: "#/components/schemas/IdentityKey"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TableList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TableDefinition"
    ViewCreateRequest:
      type: object
      additionalProperties: false
      required: [tenantId, workspaceId, id, name]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        columns:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        filters:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ViewFilter"
        sorts:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ViewSort"
    ViewFilter:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,127}$"
        operator:
          type: string
          enum: [eq, ne, contains, in, gt, gte, lt, lte]
        value: {}
    ViewSort:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
