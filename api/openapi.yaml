components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://127.0.0.1:5556/dex/.well-known/openid-configuration
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The principal is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The bounded command payload is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current state or idempotency data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionRequired:
      description: The expected revision is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The projection rebuild service is not configured or ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      description: Tenant scope for the request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CommandOperationID:
      name: operationID
      in: path
      required: true
      schema:
        type: string
        pattern: "^cmd-[a-f0-9]{24}$"
    WorkspaceIdQuery:
      name: workspaceId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TableIdQuery:
      name: tableId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ViewIdQuery:
      name: viewId
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque stable cursor returned by a previous page.
      schema:
        type: string
        maxLength: 2048
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Last SSE event id received by the client.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 20
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    VersionQuery:
      name: version
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    ConsumerQuery:
      name: consumer
      in: query
      required: true
      description: One durable projection consumer name.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SchemaId:
      name: schemaId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
    IfMatchRecord:
      name: If-Match
      in: header
      required: true
      description: Expected current recordVersion as a quoted ETag.
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
  headers:
    RevisionETag:
      description: Current schema revision as a quoted ETag.
      schema:
        type: string
    RecordVersionETag:
      description: Current recordVersion as a quoted ETag.
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          example: AUTHENTICATION_REQUIRED
        message:
          type: string
          maxLength: 512
          example: Authentication is required.
        requestId:
          type: string
          maxLength: 128
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [mongodb, nats, dex]
          properties:
            mongodb:
              $ref: "#/components/schemas/DependencyStatus"
            nats:
              $ref: "#/components/schemas/DependencyStatus"
            dex:
              $ref: "#/components/schemas/DependencyStatus"
    DependencyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    ProjectApplicationAssociation:
      type: object
      additionalProperties: false
      required: [id, tenantId, workspaceId, projectRef, applicationRef, workflowId, workflowRunId, approvalStatus, proposalHash, dispatchGeneration, decisionVersion, sourceVersion, observedVersion, projectionState, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        workspaceId:
          type: string
        projectRef:
          type: string
          pattern: "^fluxion:PROJECT:[0-9a-fA-F-]{36}$"
        applicationRef:
          type: string
          pattern: "^approver:APPLICATION:[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
        workflowId:
          type: string
        workflowRunId:
          type: string
        approvalStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED, FAILED]
        proposalHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        dispatchGeneration:
          type: integer
          minimum: 1
        decisionVersion:
          type: integer
          minimum: 1
        sourceVersion:
          type: integer
          minimum: 0
        observedVersion:
          type: integer
          minimum: 0
        lastEventId:
          type: string
        projectionState:
          type: string
          enum: [CURRENT, GAP, CONFLICT]
        updatedAt:
          type: string
          format: date-time
    ProjectionOperationsSnapshot:
      type: object
      additionalProperties: false
      required: [tenantId, workspaceId, consumer, inbox, checkpoints, freshness, generatedAt]
      properties:
        tenantId:
          type: string
        workspaceId:
          type: string
        consumer:
          type: string
        inbox:
          $ref: "#/components/schemas/InboxOperationsSummary"
        checkpoints:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProjectionCheckpoint"
        freshness:
          $ref: "#/components/schemas/ProjectionFreshness"
        generatedAt:
          type: string
          format: date-time
    ProjectionFreshness:
      type: object
      additionalProperties: false
      required: [lastProjectedVersion, lagAgeSeconds, backlog, failures, errorBudgetRemaining, sloBreached]
      properties:
        lastProjectedAt:
          type: string
          format: date-time
        lastEventId:
          type: string
        lastProjectedVersion:
          type: integer
          minimum: 0
        lagAgeSeconds:
          type: number
          minimum: 0
        backlog:
          type: integer
          minimum: 0
        failures:
          type: integer
          minimum: 0
        errorBudgetRemaining:
          type: integer
          minimum: 0
        sloBreached:
          type: boolean
    ProjectionRebuildScopeRequest:
      type: object
      additionalProperties: false
      required: [tenantId, workspaceId]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
    ProjectionRebuildOperation:
      type: object
      additionalProperties: false
      required: [operationId, tenantId, workspaceId, status, revision, mappingCount, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        operationId:
          type: string
          pattern: "^rebuild-[a-f0-9]{24}$"
        tenantId:
          type: string
        workspaceId:
          type: string
        status:
          type: string
          enum: [ACCEPTED, RUNNING, CANCEL_REQUESTED, CANCELLED, SUCCEEDED, FAILED]
        revision:
          type: integer
          minimum: 1
        generationBefore:
          type: string
        stagingGenerationId:
          type: string
        stagingCollection:
          type: string
        activeGenerationId:
          type: string
        mappingCount:
          type: integer
          minimum: 0
        createdBy:
          $ref: "#/components/schemas/IdentityKey"
        updatedBy:
          $ref: "#/components/schemas/IdentityKey"
